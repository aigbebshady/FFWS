name: Build APK

# Builds a debug-signed APK you can sideload on a Fire TV Stick.
# Run it from the Actions tab (Run workflow), or it runs on every push to this branch.
#
# SECURITY: this repo is public and Actions artifacts of a public repo can be downloaded by any
# GitHub user. So CI builds WITHOUT the provider login (KPB_XTREAM_* stay empty) and the app asks
# for a source on first run. For a build that logs in by itself, build locally with
# kparkbar.credentials.properties (see README), or make the repo private first.
on:
  push:
    branches: [ claude/kparkbar-owntv, main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the "latest" Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -print
          find app/build/outputs/apk -name '*.apk' | while read -r f; do
            cp "$f" "out/KParkBarTV-$(basename "$(dirname "$(dirname "$f")")")-$(basename "$f")"
          done
          ls -la out

      - name: Publish Release (standard APK only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find out -name '*standard*.apk' | head -1)
          test -n "$APK"
          cp "$APK" kparkbar.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest kparkbar.apk \
            --target "$GITHUB_SHA" \
            --title "K PARK BAR TV (latest build)" \
            --notes "Debug-signed build for Fire TV / Android TV (ARM). Contains no provider login." \
            --prerelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: KParkBarTV-debug-apk
          path: out/*.apk
          if-no-files-found: error
